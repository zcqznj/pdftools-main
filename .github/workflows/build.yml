name: Build Mac & Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
        python-version: [ "3.10" ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install Python依赖
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y PySide6 || true
          pip install PySide6-Essentials nuitka zstandard
          pip install -r requirements.txt
          pip uninstall -y test pytest setuptools_scm || true

      - name: Mac安装UPX
        if: matrix.os == 'macos-latest'
        run: brew install upx

      - name: Windows安装UPX
        if: matrix.os == 'windows-latest'
        run: choco install upx

      - name: Windows Nuitka打包
        if: matrix.os == 'windows-latest'
        run: python -m nuitka pdftools.py --standalone --enable-plugin=pyside6,upx --disable-console --windows-icon-from-ico=app.ico --output-dir=dist --noinclude-module=unittest --noinclude-module=tkinter --noinclude-module=distutils --lto=yes --python-flag=-O

      - name: Mac Nuitka打包
        if: matrix.os == 'macos-latest'
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.15
          python3 -m nuitka pdftools.py --standalone --enable-plugin=pyside6,upx --disable-console --macos-app-icon=app.icns --macos-create-app-bundle --output-dir=dist --noinclude-module=unittest --noinclude-module=tkinter --noinclude-module=distutils --lto=yes --python-flag=-O

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-output
          path: dist/