name: Build Mac & Windows

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # 支持手动触发

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, macos-latest ]
        python-version: [ "3.10" ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 关键：卸载完整版PySide6，安装精简Essentials
          pip uninstall -y PySide6 || true
          pip install PySide6-Essentials
          pip install -r requirements.txt
          # 卸载自动附带的无用依赖(可选)
          pip uninstall -y setuptools_scm wheel test pytest || true

      - name: Build Windows exe
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --windowed --noconsole --name MyWinApp ^
          --exclude-module=tkinter ^
          --exclude-module=tcl ^
          --exclude-module=tkinter.tix ^
          --exclude-module=xmlrpc ^
          --exclude-module=distutils ^
          --noconfirm --strip pdftools.py

      - name: Build Mac app
        if: matrix.os == 'macos-latest'
        run: |
          export MACOSX_DEPLOYMENT_TARGET=10.15
          python3 -m PyInstaller --windowed --noconsole --name MyMacApp \
          --exclude-module=tkinter \
          --exclude-module=distutils \
          --exclude-module=test \
          --noconfirm --strip pdftools.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-output
          path: dist/