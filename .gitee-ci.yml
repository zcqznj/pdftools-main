# 定义流水线使用的镜像环境（Gitee Go 默认通常是 Linux 环境）
image: python:3.9

# 定义流水线的几个阶段
stages:
  - prepare
  - build
  - artifacts

# 准备阶段：安装依赖
prepare_job:
  stage: prepare
  script:
    - pip install --upgrade pip
    - pip install -r requirements.txt

# 构建阶段：使用 PyInstaller 打包
build_job:
  stage: build
  script:
    - echo "开始打包程序..."
    # 注意：把 main.py 换成你实际的项目入口文件名
    # --windowed 参数用于隐藏终端黑框（Linux下打包出的程序同理）
    - pyinstaller --onefile --windowed --name "MyGiteeApp" main.py

# 保存构建产物阶段：将打包好的文件上传，方便你下载
artifacts_job:
  stage: artifacts
  script:
    - echo "构建完成，准备上传构建产物"
  artifacts:
    paths:
      - dist/
    expire_in: 7 days  # 打包产物保留7天